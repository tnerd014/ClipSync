name: Build Windows Setup EXE and Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: Build Web App Once on Ubuntu (Fast & 100% Reliable)
  # ========================================================
  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ========================================================
  # Job 2: Build Windows Desktop NSIS Setup EXE
  # ========================================================
  build-windows-exe:
    name: Build Windows Setup EXE
    needs: build-web
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: electron/dist

      - name: Build Windows Installer with Electron Builder
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Windows-Setup-Installer
          path: electron/dist-electron/*.exe
          if-no-files-found: warn
          retention-days: 30

  # ========================================================
  # Job 3: Build Android APK with Gradle
  # ========================================================
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Pre-install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/*.apk release-apk/ClipSync-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: release-apk/ClipSync-Android.apk
          if-no-files-found: warn
          retention-days: 30

  # ========================================================
  # Job 4: Automatically Publish to GitHub Releases Page
  # ========================================================
  publish-release:
    name: Publish to GitHub Releases
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: ClipSync-Windows-Setup-Installer
          path: release-files

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: release-files

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ClipSync v1.0.0
          body: |
            ### 🚀 ClipSync v1.0.0 Official Release

            Download and install on your devices:

            - 💻 **Windows Desktop**: `ClipSync Setup 1.0.0.exe` (Windows 10/11 sticky note application with serverless LAN sync)
            - 📱 **Android Mobile**: `ClipSync-Android.apk` (Native Android mobile app with instant camera QR scanning and 1-tap New Note)

            #### Highlights:
            - ⚡ Instant real-time LAN clipboard sync between PC and phone
            - 📷 Instant QR Code camera pairing: Point your phone at the PC screen to pair
            - 📝 Minimalist sticky note UI with customizable color themes
            - 🔒 100% private: Direct local Wi-Fi synchronization with zero cloud tracking
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
