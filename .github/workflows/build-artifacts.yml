name: Build Windows Setup EXE and Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: Automated Windows Desktop EXE Installer Build
  # ========================================================
  build-windows-exe:
    name: Build Windows Setup EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build
          node scripts/prepare-electron.js

      - name: Build Windows Installer with Electron Builder
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Windows-Setup-Installer
          path: electron/dist-electron/*.exe
          if-no-files-found: warn
          retention-days: 30

  # ========================================================
  # Job 2: Automated Android APK Build
  # ========================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
