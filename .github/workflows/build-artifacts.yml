name: Build Windows Setup EXE and Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: Build Web App Once on Ubuntu (Fast & 100% Reliable)
  # ========================================================
  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ========================================================
  # Job 2: Build Windows Desktop NSIS Setup EXE
  # ========================================================
  build-windows-exe:
    name: Build Windows Setup EXE
    needs: build-web
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: electron/dist

      - name: Build Windows Installer with Electron Builder
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Windows-Setup-Installer
          path: electron/dist-electron/*.exe
          if-no-files-found: warn
          retention-days: 30

  # ========================================================
  # Job 3: Build Android APK with Gradle
  # ========================================================
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
